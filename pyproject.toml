[project]
name = "pyngeso"
version = "0.3.8"
description = "Simple python wrapper for the National Grid ESO Portal"
readme = "README.md"

requires-python = ">=3.11,<3.14"

dependencies = ["requests>=2.26.0,<3"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "mypy>=1.17,<2",
    "ruff",
    "pre-commit",
    "types-requests",
]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = false
log_level = "WARNING"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS",
]
